services:
  db:
    image: postgres:16-alpine
    container_name: wallet_safety_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_safety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wallet_safety_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
